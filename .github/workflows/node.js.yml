name: Testes E2E Engeplus

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --output artifacts/media
      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: artifacts/
          retention-days: 14
