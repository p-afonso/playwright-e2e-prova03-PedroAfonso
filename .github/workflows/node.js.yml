name: Build and Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:   
    - cron: '0 12 * * *'

jobs:
  build:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Use Node.js 21
      uses: actions/setup-node@v6.0.0
      with:
        node-version: 22
        cache: 'npm'      
    - run: npm install 
    - run: npx playwright install      
    - run: npm run actions  
      env:
        ZEROSTEP_TOKEN: ${{ secrets.ZEROSTEP_TOKEN }}       
